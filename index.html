<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Universo de tulipanes 🌷</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#000;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #title{position:fixed;top:max(16px,env(safe-area-inset-top));left:0;right:0;text-align:center;padding:0 14px;pointer-events:none;
    font-family:'Dancing Script',cursive;font-weight:600;font-size:clamp(2rem,9vw,3.2rem);line-height:1.12;color:#f3dcff;
    text-shadow:0 0 5px #e6a0ff,0 0 14px #c85cf0,0 0 30px #8a2bd0;opacity:0;transition:opacity 2.5s}
  #title.on{opacity:1}
  #hint{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-family:'Dancing Script',cursive;font-size:1.3rem;color:#ffd9f0;
    text-shadow:0 0 10px #ff4fb0;opacity:0;transition:opacity 1.5s;pointer-events:none}
  #hint.on{opacity:.9}
  #intro{position:fixed;inset:0;z-index:10;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:opacity 1.4s}
  #intro.off{opacity:0;pointer-events:none}
  #intro p{font-family:'Dancing Script',cursive;font-weight:600;font-style:italic;text-transform:uppercase;font-size:clamp(1.3rem,6.2vw,1.9rem);line-height:1.2;text-align:center;padding:0 22px;
    color:#f6ffa6;text-shadow:0 0 8px #ffe600,0 0 20px #ffb400}
  #intro svg{width:min(50vw,220px);filter:drop-shadow(0 0 5px #ffd800) drop-shadow(0 0 16px #ffae00);animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.07)}}
  /* carta */
  #carta{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:opacity .5s}
  #carta.on{opacity:1;pointer-events:auto}
  #carta .card{max-width:420px;max-height:88vh;overflow:auto;background:linear-gradient(#fff,#ffeaf4);border-radius:20px;padding:22px 20px 18px;text-align:center;
    box-shadow:0 0 22px 4px rgba(255,60,160,.7),0 0 70px rgba(255,60,160,.35);transform:scale(.92);transition:transform .5s;touch-action:pan-y}
  #carta.on .card{transform:scale(1)}
  #carta h2{font-family:Georgia,serif;font-size:1.05rem;color:#2a1020;margin-bottom:10px}
  #carta .txt{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:clamp(.92rem,3.9vw,1.05rem);line-height:1.5;color:#a02a70;text-align:center}
  #carta button{margin-top:14px;border:0;background:#ee4a9a;color:#fff;font-family:Georgia,serif;font-weight:700;padding:7px 22px;border-radius:99px;font-size:.9rem;cursor:pointer;box-shadow:0 0 12px #ff4fb0}
</style>
</head>

<canvas id="c"></canvas>
<div id="title"></div>
<div id="hint">Apretá el corazón 💗</div>

<div id="carta"><div class="card"><h2>Para vos</h2><div class="txt" id="cartaTxt"></div><button id="cerrar">Cerrar</button></div></div>

  tmp.sort((a,b)=>a[3]-b[3]);tmp.forEach((p,i)=>{GR[i]=p[0];GT[i]=p[1];GY[i]=p[2];GB[i]=p[3]})})();
const HN=760,HX=new Float32Array(HN),HYY=new Float32Array(HN),HZ=new Float32Array(HN),HB=new Uint8Array(HN);
const HCOL=['#ff2d55','#ff5f86','#d0123a','#ffb3c6'];
(function(){for(let i=0;i<HN;i++){
  const t=Math.random()*6.283,k=Math.random()<.45?1:Math.sqrt(Math.random());
  HX[i]=16*Math.pow(Math.sin(t),3)*.074*k+rnd(-.03,.03);
  HYY[i]=(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*.074*k+rnd(-.03,.03);
  HZ[i]=rnd(-.3,.3)*(1-.4*k);HB[i]=Math.floor(Math.random()*4)}})();

/* malla del corazón 3D */
const HM=22,HV=[],HT=[];
(function(){const ring=[];for(let i=0;i<HM;i++){const a=i/HM*6.2832;ring.push([16*Math.pow(Math.sin(a),3),13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a)+2.5])}
  ring.forEach(p=>HV.push([p[0],p[1],0]));ring.forEach(p=>HV.push([p[0]*.62,p[1]*.62,7.5]));ring.forEach(p=>HV.push([p[0]*.62,p[1]*.62,-7.5]));
  HV.push([0,0,10.5],[0,0,-10.5]);
  for(let i=0;i<HM;i++){const j=(i+1)%HM;
    HT.push([i,j,HM+j],[i,HM+j,HM+i],[HM+i,HM+j,3*HM]);
    HT.push([i,j,2*HM+j],[i,2*HM+j,2*HM+i],[2*HM+i,2*HM+j,3*HM+1])}})();

/* ---------- objetos 3D: palabras, flores, planetas, fotos ---------- */
const OBJ=[], PET=[];
function place(o,rmin=5,rmax=30,ymax=6.5,minD=3.8){
  /* prueba varias posiciones y se queda con la que quede más lejos de las demás (todo gira junto, así la separación se mantiene) */
  let best=null,bd=-1;
  for(let k=0;k<50;k++){
    const r=rnd(rmin,rmax),a=rnd(0,6.283),y=rnd(-ymax,ymax),x=Math.cos(a)*r,z=Math.sin(a)*r;
    let d=1e9;for(const q of OBJ){const dx=q.x-x,dy=q.y0-y,dz=q.z-z;d=Math.min(d,dx*dx+dy*dy+dz*dz)}
    if(d>bd){bd=d;best={r,a,y,x,z}}if(d>minD*minD)break}
  o.r=best.r;o.a=best.a;o.y0=best.y;o.x=best.x;o.z=best.z;o.w=.055;o.sp=rnd(.5,1.2);o.ph=rnd(0,6.283);OBJ.push(o);return o}
function buildScene(){
  const cols=[['#ffffff','#ff4fb0'],['#ffc2e4','#ff4fb0'],['#ff7ac8','#c0107a'],['#ffffff','#b060ff']];
  /* tus fotos: una de cada una, sin borde, siempre mirando hacia vos */
  PHO.forEach((im,i)=>place({t:'foto',img:im,size:rnd(2.8,3.4)},5+i*.8,8+i*1.8,2.8,5.5));
  const mkTxt=(t)=>{const [c,gl]=pick(cols);return txtSpr(t,c,gl)};
  CONFIG.tuyas.forEach(t=>{for(let k=0;k<5;k++)place({t:'txt',spr:mkTxt(t),size:rnd(.7,1.2)})});
  CONFIG.extras.forEach(t=>{for(let k=0;k<2;k++)place({t:'txt',spr:mkTxt(t),size:rnd(.55,1.0)})});
  /* flores: muchas más que antes */
  for(let i=0;i<12;i++)place({t:'img',spr:SPR.red,size:rnd(1.8,2.8)});
  for(let i=0;i<8;i++)place({t:'img',spr:SPR.pink,size:rnd(1.8,2.6)});
  for(let i=0;i<5;i++)place({t:'img',spr:SPR.yel,size:rnd(1.6,2.4)});
  for(let i=0;i<5;i++)place({t:'img',spr:SPR.vio,size:rnd(1.6,2.4)});
  for(let i=0;i<7;i++)place({t:'img',spr:SPR.hf,size:rnd(1.6,2.4)});
  for(let i=0;i<5;i++)place({t:'img',spr:SPR.brown,size:rnd(1.4,2.2)});
  /* tus dibujos de tulipanes por todo el universo */
  for(let i=0;i<12;i++)place({t:'img',spr:TUL[0],size:rnd(2.2,3.2)});
  for(let i=0;i<10;i++)place({t:'img',spr:TUL[1],size:rnd(2.0,3.0)});
  for(let i=0;i<6;i++)place({t:'img',spr:pick(PL),size:rnd(1.6,3)});
  for(let i=0;i<3;i++)place({t:'img',spr:astro,size:rnd(2,3.4)});
  /* pétalos cayendo */
  const pc=['#ff3d6e','#ff8fb0','#ffd0e0','#ff5f9e','#e0285a','#ffb3d4','#ffffff'];
  for(let i=0;i<280;i++){const r=rnd(4,26);PET.push({r,a:rnd(0,6.283),w:1.2/(r+6),y:rnd(-9,9),fall:rnd(.15,.5),s:rnd(.16,.4),c:pick(pc),ph:rnd(0,6.283),sp:rnd(.8,2.2)})}
}
Promise.race([document.fonts?document.fonts.load('600 56px "Dancing Script"'):0,new Promise(r=>setTimeout(r,1800))]).catch(()=>{}).then(buildScene);

/* ---------- cámara ---------- */
let T=0,last=0,yawOff=0,pitchOff=0,distOff=0,idle=9,started=false;
let cyw,syw,cpt,spt,D,cx0,cy0,X,Y,Z;
function P(x,y,z){const x1=x*cyw-z*syw,z1=x*syw+z*cyw;Y=y*cpt+z1*spt;Z=-y*spt+z1*cpt+D;const k=F/Z;X=cx0+x1*k;Y=cy0-Y*k;return Z}
let pitch=.5,glitch=0,bands=[],heart={x:0,y:0,r:0};
const ease=k=>1-Math.pow(1-k,3);

function drawCenter(t,c){
  gg.setTransform(1,0,0,1,0,0);gg.clearRect(0,0,W,H);gg.globalCompositeOperation='lighter';
  P(0,0,0);const ox=X,oy=Y,oz=Z;
  const sinP=Math.abs(spt),flat=.22+.78*sinP;
  /* resplandor (limitado para no tapar lo de alrededor) */
  const R=4.6*F/oz,fl=1-.35*c+(glitch>0?rnd(-.15,.2):0);
  gg.save();gg.translate(ox,oy);gg.scale(1,flat);gg.globalAlpha=clamp(.55*fl,0,.7);gg.drawImage(glow,-R,-R,2*R,2*R);gg.restore();
  /* galaxia */
  const spin=t*.55;let lastB=-1;gg.globalAlpha=.8;
  for(let i=0;i<GN;i++){
    const r=GR[i],a=GT[i]+spin*1.3/(.5+r*.45),x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(P(x,GY[i],z)<.8)continue;
    if(GB[i]!==lastB){lastB=GB[i];gg.fillStyle=GCOL[lastB]}
    const s=clamp(.05*F/Z,1,5*dpr);gg.fillRect(X-s/2,Y-s/2,s,s);
  }
  /* corazón 2D: plano, gira al revés que el 3D */
  {const hy2=1.95+.12*Math.sin(t*1.3),ha=-t*.9,ch=Math.cos(ha),sh=Math.sin(ha),k=.112*(1+.05*Math.pow(Math.max(Math.sin(t*3.2),0),2));
   const pts=[];let ok=true;
   for(let i=0;i<=72;i++){const a=i/72*6.2832,x=16*Math.pow(Math.sin(a),3)*k,y=(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a)+2.5)*k;
     if(P(x*ch,y+hy2,x*sh)<.8){ok=false;break}pts.push([X,Y])}
   if(ok){P(0,hy2,0);const cx=X,cy=Y,R=19*k*F/Z;
     gg.globalCompositeOperation='source-over';gg.beginPath();pts.forEach((p,i)=>i?gg.lineTo(p[0],p[1]):gg.moveTo(p[0],p[1]));gg.closePath();
     const gr=gg.createRadialGradient(cx-R*.2,cy-R*.2,R*.05,cx,cy,R);gr.addColorStop(0,'#ff8fae');gr.addColorStop(.6,'#e0245a');gr.addColorStop(1,'#a10f3c');
     gg.globalAlpha=.5;gg.shadowColor='#ff3d86';gg.shadowBlur=26*dpr;gg.fillStyle=gr;gg.fill();
     gg.shadowBlur=0;gg.globalAlpha=.9;gg.lineWidth=1.6*dpr;gg.lineJoin='round';gg.strokeStyle='#ffd0e0';gg.stroke();gg.globalAlpha=1}
   gg.globalCompositeOperation='lighter'}
  /* corazón 3D de caras (low-poly, como el de papel) */
  {const beat=1+.06*Math.pow(Math.max(Math.sin(t*3.2),0),2),hy=1.95+.12*Math.sin(t*1.3);
   const ha=t*.9,ch=Math.cos(ha),sh=Math.sin(ha),k=.088*beat;
   gg.globalCompositeOperation='source-over';gg.globalAlpha=1;
   const V=HV.map(v=>{const x=v[0]*k,y=v[1]*k,z=v[2]*k;return[x*ch-z*sh,y+hy,x*sh+z*ch]});
   const S=V.map(w=>{P(w[0],w[1],w[2]);return[X,Y,Z]});
   const tri=[];
   for(const [a,b,c] of HT){
     const A=V[a],B=V[b],C=V[c];if(S[a][2]<.8||S[b][2]<.8||S[c][2]<.8)continue;
     const ux=B[0]-A[0],uy=B[1]-A[1],uz=B[2]-A[2],vx=C[0]-A[0],vy=C[1]-A[1],vz=C[2]-A[2];
     let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;
     const cx=(A[0]+B[0]+C[0])/3,cy=(A[1]+B[1]+C[1])/3-hy,cz=(A[2]+B[2]+C[2])/3;
     if(nx*cx+ny*cy+nz*cz<0){nx=-nx;ny=-ny;nz=-nz}
     const l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;
     /* normal en el espacio de la cámara, luz arriba-izquierda hacia el que mira */
     const x1=nx*cyw-nz*syw,z1=nx*syw+nz*cyw,yy=ny*cpt+z1*spt,zz=-ny*spt+z1*cpt;
     const d=Math.max(0,x1*-.35+yy*.5+zz*-.8),sd=.5+.5*d;
     tri.push([(S[a][2]+S[b][2]+S[c][2])/3,a,b,c,sd]);
   }
   tri.sort((p,q)=>q[0]-p[0]);
   for(const [,a,b,c,sd] of tri){
     const r=Math.min(255,Math.round(250*sd+(sd>.93?5:0))),gr=Math.min(255,Math.round(48*sd+(sd>.93?70:0))),bl=Math.min(255,Math.round(78*sd+(sd>.93?70:0)));
     const col='rgb('+r+','+gr+','+bl+')';
     gg.fillStyle=col;gg.strokeStyle=col;gg.lineWidth=1;
     gg.beginPath();gg.moveTo(S[a][0],S[a][1]);gg.lineTo(S[b][0],S[b][1]);gg.lineTo(S[c][0],S[c][1]);gg.closePath();gg.fill();gg.stroke();
   }
   P(0,hy,0);
  }
  P(0,1.95+.12*Math.sin(t*1.3),0);heart.x=X;heart.y=Y;heart.r=1.8*F/Z;
  gg.globalCompositeOperation='source-over';gg.globalAlpha=1;
  return oz;
}

/* ---------- bucle ---------- */
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000||.016);last=now;T+=dt;idle+=dt;
  if(idle>3){const k=Math.exp(-dt*.7);yawOff*=k;pitchOff*=k;distOff*=k}
  const kin=ease(Math.min(1,T/6));
  const base=11+6.2*Math.sin(T*.1+.5);               /* se acerca y se aleja del sol */
  D=clamp(28+(base-28)*kin+distOff,4.4,32);
  const yaw=T*.12+yawOff;pitch=clamp(.5+.6*Math.sin(T*.14)+pitchOff,-.15,1.45); /* y gira alrededor */
  cyw=Math.cos(yaw);syw=Math.sin(yaw);cpt=Math.cos(pitch);spt=Math.sin(pitch);
  cx0=W/2;cy0=H*.47;
  const close=clamp((8.5-D)/4,0,1);                 /* qué tan cerca del centro */
  /* glitch del sol: corto y solo sobre la galaxia, así se sigue viendo el alrededor */
  if(glitch>0)glitch-=dt;
  else if(Math.random()<.5*close*dt*6){glitch=rnd(.08,.22);bands=[];const n=2+Math.floor(Math.random()*3);for(let i=0;i<n;i++)bands.push([rnd(0,H),rnd(.03,.12)*H,rnd(-.05,.05)*W])}

  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.fillStyle='#040009';g.fillRect(0,0,W,H);
  /* cielo */
  g.fillStyle='#fff';
  for(let i=0;i<SKY.length;i++){const s=SKY[i];if(P(s[0],s[1],s[2])<5)continue;g.globalAlpha=.5+.5*Math.sin(T*1.5+i);g.fillRect(X,Y,1.6*dpr,1.6*dpr)}
  /* suelo de estrellas */
  const tw=.78+.22*Math.sin(T*2);
  RNG.forEach(([a,b],gi)=>{g.fillStyle=COLS[gi];g.globalAlpha=tw;
    for(let i=a;i<b;i++){if(P(PX[i],PY[i],PZ[i])<4)continue;const s=clamp(PS[i]*F/Z,1,2.2*dpr);g.fillRect(X,Y,s,s)}});
  g.globalAlpha=1;

  /* lista de cosas para ordenar por profundidad */
  const items=[];
  for(const o of OBJ){
    const a=o.a+T*o.w,x=Math.cos(a)*o.r,z=Math.sin(a)*o.r,y=o.y0+Math.sin(T*o.sp+o.ph)*.35;
    const zz=P(x,y,z);if(zz<.7)continue;items.push({o,x,y,z,zz,sx:X,sy:Y});
  }
  for(const p of PET){
    const a=p.a+T*p.w;let y=((p.y-T*p.fall+9)%18+18)%18-9;
    const zz=P(Math.cos(a)*p.r,y,Math.sin(a)*p.r);if(zz<.7)continue;items.push({p,zz,sx:X,sy:Y});
  }
  const oz=drawCenter(T,close);items.push({c:1,zz:oz});
  items.sort((a,b)=>b.zz-a.zz);

  for(const it of items){
    if(it.c){
      g.globalAlpha=1;g.drawImage(gal,0,0);
      if(glitch>0){g.globalCompositeOperation='lighter';g.globalAlpha=.7;
        for(const [by,bh,dx] of bands){g.drawImage(gal,0,by,W,bh,dx,by,W,bh)}
        g.globalCompositeOperation='source-over';g.globalAlpha=1}
      continue}
    const zz=it.zz,fade=clamp((zz-2)/3.5,0,1)*clamp(1.5-zz/38,0,1);if(fade<=.01)continue;
    if(it.p){const p=it.p,r=p.s*F/zz;if(it.sx<-r||it.sx>W+r||it.sy<-r||it.sy>H+r)continue;
      g.globalAlpha=fade*.9;g.fillStyle=p.c;g.beginPath();g.ellipse(it.sx,it.sy,r*.55*Math.abs(Math.cos(T*p.sp+p.ph))+r*.1,r*.9,T*.6+p.ph,0,7);g.fill();continue}
    const o=it.o;
    if(o.t==='foto'){
      const im=o.img;if(!im.complete||!im.naturalWidth)continue;
      const asp=im.naturalWidth/im.naturalHeight,hw=o.size*asp/2,hh=o.size/2;
      const th=yaw+Math.sin(T*.45+o.ph)*.5,tx=pitch+Math.sin(T*.33+o.ph*2)*.22,tz=Math.sin(T*.3+o.ph)*.18;
      const cT=Math.cos(th),sT=Math.sin(th),cX=Math.cos(tx),sX=Math.sin(tx),cZ=Math.cos(tz),sZ=Math.sin(tz);
      const pts=[[-hw,hh],[hw,hh],[-hw,-hh]],out=[];let ok=true;
      for(const [lx,ly] of pts){
        const x=lx*cZ-ly*sZ,y=lx*sZ+ly*cZ;
        const y3=y*cX,z3=y*sX;                 /* inclinación hacia la cámara */
        const x2=x*cT+z3*sT,z2=-x*sT+z3*cT;    /* giro hacia la cámara */
        const zz2=P(it.x+x2,it.y+y3,it.z+z2);if(zz2<.8){ok=false;break}out.push([X,Y])}
      if(!ok)continue;
      const w=im.naturalWidth,h=im.naturalHeight,[p0,p1,p3]=out;
      g.setTransform((p1[0]-p0[0])/w,(p1[1]-p0[1])/w,(p3[0]-p0[0])/h,(p3[1]-p0[1])/h,p0[0],p0[1]);
      g.globalAlpha=fade*.96;g.drawImage(im,0,0);g.setTransform(1,0,0,1,0,0);continue}
    const spr=o.spr,sw=dimW(spr),sh=dimH(spr);if(!sw)continue;
    const hpx=o.size*F/zz,wpx=hpx*sw/sh,m=Math.max(wpx,hpx);
    if(it.sx<-m||it.sx>W+m||it.sy<-m||it.sy>H+m)continue;
    const rot=Math.sin(T*o.sp+o.ph)*(o.t==='txt'?.05:.14);
    g.globalAlpha=fade*(o.t==='txt'?.95:1);
    g.save();g.translate(it.sx,it.sy);g.rotate(rot);g.drawImage(spr,-wpx/2,-hpx/2,wpx,hpx);g.restore();
  }
  g.globalAlpha=1;
}

/* ---------- control: arrastrar, pellizcar, tocar el corazón ---------- */
const ptr=new Map();let down=null,pinch0=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);idle=0;
  down={x:e.clientX,y:e.clientY,t:performance.now(),moved:0};if(ptr.size===2){const [a,b]=[...ptr.values()];pinch0=Math.hypot(a[0]-b[0],a[1]-b[1])}});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const p=ptr.get(e.pointerId);idle=0;
  if(ptr.size===2){ptr.set(e.pointerId,[e.clientX,e.clientY]);const [a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);distOff-=(d-pinch0)*.04;pinch0=d;down&&(down.moved=99);return}
  const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;
  yawOff-=dx*.006;pitchOff+=dy*.005;if(down)down.moved+=Math.abs(dx)+Math.abs(dy)});
const up=e=>{ptr.delete(e.pointerId);
  if(down&&e.type==='pointerup'&&down.moved<10&&performance.now()-down.t<400){
    const x=e.clientX*dpr,y=e.clientY*dpr,r=Math.max(heart.r,46*dpr);
    if(Math.hypot(x-heart.x,y-heart.y)<r)$('carta').classList.add('on')}
  if(!ptr.size)down=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();idle=0;distOff+=e.deltaY*.01},{passive:false});
$('cerrar').onclick=()=>$('carta').classList.remove('on');
$('carta').addEventListener('pointerdown',e=>{if(e.target===$('carta'))$('carta').classList.remove('on')});

/* ---------- inicio y música ---------- */
/* música de fondo: Tan Biónica - Loca, archivo musica.mp3 (misma carpeta que el html). Arranca sola al tocar los tulipanes (los navegadores no dejan sonar antes de un toque) */
const music=new Audio();music.loop=true;music.volume=.85;music.preload='auto';music.setAttribute('playsinline','');
music.src='musica.mp3';                          /* la canción está en el archivo musica.mp3, junto a este html */
const tryPlay=()=>{if(started&&music.paused)music.play().catch(()=>{})};
$('intro').addEventListener('click',()=>{
  started=true;music.play().catch(()=>{});$('intro').classList.add('off');
  setTimeout(()=>$('title').classList.add('on'),600);
  setTimeout(()=>$('title').classList.remove('on'),6500);
  setTimeout(()=>$('hint').classList.add('on'),3000);
});
/* si el navegador la frenó, vuelve a intentar con cualquier toque */
['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,tryPlay,true));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tryPlay()});
requestAnimationFrame(frame);
</script>
