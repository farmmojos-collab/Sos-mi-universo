<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Universo de tulipanes 🌷</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#000;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #title{position:fixed;top:max(16px,env(safe-area-inset-top));left:0;right:0;text-align:center;padding:0 14px;pointer-events:none;
    font-family:'Dancing Script',cursive;font-weight:600;font-size:clamp(2rem,9vw,3.2rem);line-height:1.12;color:#f3dcff;
    text-shadow:0 0 5px #e6a0ff,0 0 14px #c85cf0,0 0 30px #8a2bd0;opacity:0;transition:opacity 2.5s}
  #title.on{opacity:1}
  #hint{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-family:'Dancing Script',cursive;font-size:1.3rem;color:#ffd9f0;
    text-shadow:0 0 10px #ff4fb0;opacity:0;transition:opacity 1.5s;pointer-events:none}
  #hint.on{opacity:.9}
  #intro{position:fixed;inset:0;z-index:10;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:opacity 1.4s}
  #intro.off{opacity:0;pointer-events:none}
  #intro p{font-family:'Dancing Script',cursive;font-weight:600;font-style:italic;text-transform:uppercase;font-size:clamp(1.3rem,6.2vw,1.9rem);line-height:1.2;text-align:center;padding:0 22px;
    color:#f6ffa6;text-shadow:0 0 8px #ffe600,0 0 20px #ffb400}
  #intro svg{width:min(50vw,220px);filter:drop-shadow(0 0 5px #ffd800) drop-shadow(0 0 16px #ffae00);animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.07)}}
  /* carta */
  #carta{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:opacity .5s}
  #carta.on{opacity:1;pointer-events:auto}
  #carta .card{max-width:420px;max-height:88vh;overflow:auto;background:linear-gradient(#fff,#ffeaf4);border-radius:20px;padding:22px 20px 18px;text-align:center;
    box-shadow:0 0 22px 4px rgba(255,60,160,.7),0 0 70px rgba(255,60,160,.35);transform:scale(.92);transition:transform .5s;touch-action:pan-y}
  #carta.on .card{transform:scale(1)}
  #carta h2{font-family:Georgia,serif;font-size:1.05rem;color:#2a1020;margin-bottom:10px}
  #carta .txt{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:clamp(.92rem,3.9vw,1.05rem);line-height:1.5;color:#a02a70;text-align:center}
  #carta button{margin-top:14px;border:0;background:#ee4a9a;color:#fff;font-family:Georgia,serif;font-weight:700;padding:7px 22px;border-radius:99px;font-size:.9rem;cursor:pointer;box-shadow:0 0 12px #ff4fb0}
</style>
</head>

<canvas id="c"></canvas>
<div id="title"></div>
<div id="hint">Apretá el corazón 💗</div>

<div id="carta"><div class="card"><h2>Para vos</h2><div class="txt" id="cartaTxt"></div><button id="cerrar">Cerrar</button></div></div>
